# Production stack. Only Caddy publishes host ports; everything else stays on the internal network.
# Copy .env.prod.example to .env and fill in the values, then run:
#   docker compose -f compose.prod.yaml up -d --build
name: paceforge

# The database settings, shared by every service that runs the backend image. The discrete
# variables go to Django as they are, so no password is ever put into a URL. An empty
# DATABASE_URL overrides one that may be set in .env.
x-backend-environment: &backend-environment
  DJANGO_DEBUG: "false"
  DATABASE_URL: ""
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-paceforge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_DB: ${POSTGRES_DB:-paceforge}

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paceforge}
      # No default on purpose: PostgreSQL refuses to start without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-paceforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-paceforge-backend:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-environment
      # Caddy is the only way in and sets X-Forwarded-Proto, so Django may trust it.
      DJANGO_TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy

  # The background jobs. Waits for the backend so that the migrations are done first.
  scheduler:
    image: ${BACKEND_IMAGE:-paceforge-backend:local}
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-environment
    depends_on:
      backend:
        condition: service_healthy

  # Encrypted database backups on a schedule. Off by default: set COMPOSE_PROFILES=backup in .env
  # (or pass --profile backup) and BACKUP_ENCRYPTION_KEY.
  backup:
    image: ${BACKEND_IMAGE:-paceforge-backend:local}
    profiles: [backup]
    restart: unless-stopped
    command: ["python", "manage.py", "run_backups"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-environment
      BACKUP_DIR: "/backups"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-paceforge-frontend:local}
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
