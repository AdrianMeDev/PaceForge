# Production stack. Only Caddy publishes host ports; everything else stays on the internal network.
# Copy .env.prod.example to .env and fill in the values, then run:
#   docker compose -f compose.prod.yaml up -d --build
name: paceforge

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paceforge}
      # No default on purpose: PostgreSQL refuses to start without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-paceforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-paceforge-backend:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-paceforge}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-paceforge}
    depends_on:
      db:
        condition: service_healthy

  # The background jobs. Waits for the backend so that the migrations are done first.
  scheduler:
    image: ${BACKEND_IMAGE:-paceforge-backend:local}
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-paceforge}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-paceforge}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-paceforge-frontend:local}
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
