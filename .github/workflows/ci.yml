name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: paceforge
          POSTGRES_PASSWORD: paceforge-ci
          POSTGRES_DB: paceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paceforge -d paceforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away database for the CI test runs only.
      DATABASE_URL: postgres://paceforge:paceforge-ci@localhost:5432/paceforge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # pg_dump and pg_restore 17 for the backup restore test; the runner image ships an older client.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: uv sync --frozen
      # Fresh keys for every run: none is committed, and the masked values never reach the log.
      - name: Generate Django and encryption keys
        run: |
          encryption_key="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          secret_key="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$encryption_key"
          echo "::add-mask::$secret_key"
          echo "ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"
          echo "DJANGO_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - name: Migrations are up to date
        run: |
          uv run python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.settings_test uv run python manage.py makemigrations --check --dry-run
      # One worker per core; every worker has its own test database.
      - run: uv run pytest -n auto

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx ng test --no-watch
      - run: npx ng build

  containers:
    name: Containers (Docker, Caddy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production Compose config
        run: |
          docker compose -f compose.prod.yaml config >/dev/null
          docker compose --env-file .env.prod.example -f compose.prod.yaml config >/dev/null
          docker compose --profile backup --env-file .env.prod.example -f compose.prod.yaml config >/dev/null
          # A password with URL-reserved characters must not break the config.
          POSTGRES_PASSWORD='p@ss:w/rd?a#b%c&d+e=f' \
            docker compose --profile backup -f compose.prod.yaml config >/dev/null
          docker compose -f compose.dev.yaml --profile scheduler config >/dev/null
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e APP_DOMAIN=localhost \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production images
        run: docker compose -f compose.prod.yaml build
      - name: Check PostgreSQL client tools in the backend image
        run: |
          docker compose -f compose.prod.yaml run --rm --no-deps --entrypoint pg_dump backend --version
          docker compose -f compose.prod.yaml run --rm --no-deps --entrypoint pg_restore backend --version
