name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: paceforge
          POSTGRES_PASSWORD: paceforge-ci
          POSTGRES_DB: paceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paceforge -d paceforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away values for the CI database and test runs only.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://paceforge:paceforge-ci@localhost:5432/paceforge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - name: Migrations are up to date
        run: |
          uv run python manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.settings_test uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx ng test --no-watch
      - run: npx ng build
