# Development services only. Django itself runs locally via `uv run`.
# Copy .env.example to .env to override the defaults below.
name: paceforge-dev

# Set POSTGRES_PASSWORD in .env (or the shell) before the first start; there is no default.
x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-paceforge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  POSTGRES_DB: ${POSTGRES_DB:-paceforge}

services:
  db:
    image: postgres:17.11
    environment: *db-credentials
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

  # The background jobs (sync, Sunday review and draft). Runs the repo through uv, so it reads
  # .env from the mounted source. Start with: docker compose -f compose.dev.yaml --profile scheduler up -d
  scheduler:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    profiles: [scheduler]
    command: ["uv", "run", "python", "manage.py", "run_scheduler"]
    environment:
      <<: *db-credentials
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    working_dir: /app/backend
    volumes:
      - .:/app
      - uv-cache:/app/backend/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uv-cache:
