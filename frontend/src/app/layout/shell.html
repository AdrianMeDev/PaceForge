<header class="bar">
  <span class="brand">PaceForge</span>
  <nav class="nav" aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      >Dashboard</a
    >
    <a routerLink="/activities" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Activities</a
    >
    <a routerLink="/goals" routerLinkActive="active" ariaCurrentWhenActive="page">Goals</a>
    <a routerLink="/availability" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Training time</a
    >
    <a routerLink="/season" routerLinkActive="active" ariaCurrentWhenActive="page">Season</a>
    <a routerLink="/planning" routerLinkActive="active" ariaCurrentWhenActive="page">Week plan</a>
    <a routerLink="/review" routerLinkActive="active" ariaCurrentWhenActive="page">Week review</a>
    <a routerLink="/settings/profile" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Profile</a
    >
    <a routerLink="/settings/security" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Security</a
    >
    <a routerLink="/settings/connections" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Connections</a
    >
    @if (isStaff()) {
      <a routerLink="/admin/invitations" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Invitations</a
      >
    }
  </nav>
  <span class="user" data-testid="user-label">{{ userLabel() }}</span>
  <button type="button" class="link" (click)="logout()">Sign out</button>
</header>
<main class="content">
  <router-outlet />
</main>
