<div class="shell">
  <aside class="side">
    <span class="brand">PaceForge</span>
    <nav aria-label="Main">
      @for (group of groups(); track group.label) {
        <div class="group" [attr.data-group]="group.label">
          <h2 class="group-title sr-only lg:not-sr-only">{{ group.label }}</h2>
          <ul>
            @for (item of group.items; track item.path) {
              <li>
                <a
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ exact: item.exact === true }"
                  [attr.title]="item.label"
                >
                  <app-icon [name]="item.icon" />
                  <span class="sr-only lg:not-sr-only">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
    <div class="who">
      <span class="user sr-only lg:not-sr-only" data-testid="user-label">{{ userLabel() }}</span>
      <button type="button" class="signout" data-testid="sign-out" (click)="logout()">
        <app-icon name="log-out" />
        <span class="sr-only lg:not-sr-only">Sign out</span>
      </button>
    </div>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
