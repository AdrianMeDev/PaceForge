<main class="auth-card">
  <h1 class="m-0 mb-4 text-2xl font-semibold">Two-factor authentication</h1>
  <p>Enter the code from your authenticator app, or one of your recovery codes.</p>

  @for (message of errors(); track $index) {
    <p class="alert" role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="code">Code</label>
      <input
        #codeInput
        id="code"
        type="text"
        inputmode="numeric"
        formControlName="code"
        autocomplete="one-time-code"
        [attr.aria-invalid]="form.controls.code.touched && form.controls.code.invalid"
        [attr.aria-describedby]="
          form.controls.code.touched && form.controls.code.invalid ? 'code-error' : null
        "
      />
      @if (form.controls.code.touched && form.controls.code.invalid) {
        <p class="field-error" id="code-error">Enter a code.</p>
      }
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Checking…' : 'Continue' }}
    </button>
  </form>
  <p class="links mt-4">
    <button type="button" class="btn btn-ghost btn-sm" (click)="cancel()">Back to sign in</button>
  </p>
</main>
